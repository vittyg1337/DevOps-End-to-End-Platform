name: DevOps CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform Formatting
        run: terraform -chdir=terraform fmt -check

      - name: Initialize Terraform Without a Backend
        run: terraform -chdir=terraform init -backend=false

      - name: Validate Terraform
        run: terraform -chdir=terraform validate

      - name: Build and Smoke Test Application
        shell: pwsh
        run: ./tests/smoke.ps1

      - name: Verify Kubernetes Security Controls
        shell: pwsh
        run: |
          $manifest = Get-Content ./kubernetes/deployment.yaml -Raw
          @(
            "allowPrivilegeEscalation: false",
            "readOnlyRootFilesystem: true",
            "runAsNonRoot: true"
          ) | ForEach-Object {
            if (-not $manifest.Contains($_)) {
              throw "Missing Kubernetes security control: $_"
            }
          }
