---
- name: Configure the DevOps lab web server
  hosts: devops_servers
  become: true

  tasks:
    - name: Install Docker
      ansible.builtin.apt:
        name: docker.io
        state: present
        update_cache: true

    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Run the Nginx web container
      community.docker.docker_container:
        name: portfolio-webapp
        image: nginx:1.27-alpine
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "80:80"
