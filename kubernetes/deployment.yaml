apiVersion: apps/v1
kind: Deployment
metadata:
  name: docker-webapp
  labels:
    app: docker-webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: docker-webapp
  template:
    metadata:
      labels:
        app: docker-webapp
    spec:
      containers:
        - name: docker-webapp
          image: docker-webapp:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
